name: 🐛 Błąd
description: Coś nie działa tak, jak powinno
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Co się stało
      description: Co zrobiłeś, czego się spodziewałeś i co dostałeś.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Jak odtworzyć
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wersja
      description: Tag obrazu albo commit.
  - type: textarea
    id: env
    attributes:
      label: Środowisko
      description: Urządzenie, system, przeglądarka. Nie wklejaj adresów, tokenów ani haseł.
