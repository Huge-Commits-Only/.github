name: Security Verification
run-name: >-
  ${{
      github.event_name == 'pull_request'
      && format('Security Verification for CI: PR #{0} -> {1}', github.event.number, github.event.pull_request.title)
      ||
      github.event_name == 'push'
      && format('Security Verification for CI: Merge -> {0}', github.event.head_commit.message)
      ||
      'Security Verification: Weekly scan'
  }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [$default-branch]
  schedule:
    # Monday 06:00 UTC: catches new CVEs in code that has not changed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Git -- Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📘 Go -- Set up
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: 🧪 Go -- Test Vulnerability -> Modules
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Git -- Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🧪 Trivy -- Test Vuln, Secret, Misconfig -> File System
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"
